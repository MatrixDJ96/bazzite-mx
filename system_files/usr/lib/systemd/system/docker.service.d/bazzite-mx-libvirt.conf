# Docker sets the FORWARD policy to DROP as it starts; this rebuilds the
# BAZZITE-MX-LIBVIRT chain and its jump from DOCKER-USER once dockerd is
# ready, so a VM on a libvirt NAT network keeps the outside (the helper's
# header says how).
# The `-` keeps a failure of the helper from failing docker.service: it lands
# in the journal as `ERROR: …` and Docker stays up.
[Service]
ExecStartPost=-/usr/libexec/bazzite-mx-libvirt-forward
