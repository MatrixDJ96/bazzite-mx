# The /var directories the libvirt and swtpm packages ship, owner and mode as
# `rpm -qlv` lists them (/var/log/libvirt is in the base's bazzite-libvirt.conf);
# /var/log/swtpm{,/libvirt}, owned by no package, as 0755 root. The image ships
# no /var, so a host gets them here; without /var/lib/swtpm-localca swtpm_setup
# cannot create a guest's TPM.

d /var/cache/libvirt 0711 root root - -
d /var/cache/libvirt/qemu 0750 root root - -
d /var/lib/libvirt 0755 root root - -
d /var/lib/libvirt/boot 0711 root root - -
d /var/lib/libvirt/dnsmasq 0755 root root - -
d /var/lib/libvirt/filesystems 0711 root root - -
d /var/lib/libvirt/images 0711 root root - -
d /var/lib/libvirt/network 0700 root root - -
d /var/lib/libvirt/qemu 0751 qemu qemu - -
d /var/lib/libvirt/qemu/checkpoint 0751 qemu qemu - -
d /var/lib/libvirt/qemu/dump 0751 qemu qemu - -
d /var/lib/libvirt/qemu/nvram 0751 qemu qemu - -
d /var/lib/libvirt/qemu/ram 0751 qemu qemu - -
d /var/lib/libvirt/qemu/save 0751 qemu qemu - -
d /var/lib/libvirt/qemu/snapshot 0751 qemu qemu - -
d /var/lib/libvirt/swtpm 0711 root root - -
d /var/lib/swtpm-localca 0750 tss root - -
d /var/log/libvirt/qemu 0700 root root - -
d /var/log/swtpm 0755 root root - -
d /var/log/swtpm/libvirt 0755 root root - -
d /var/log/swtpm/libvirt/qemu 0730 tss tss - -

# qemu reads ISOs on mounted disks (the home's ACL:
# user-setup.hooks.d/13-bazzite-mx-qemu-home.sh). The default entry reaches
# /run/media/<user>, which udisks creates 0750 at each first mount and to whose
# inherited ACL it adds its user's (udisks 2.11.2, src/udiskslinuxfilesystem.c).
a+ /run/media - - - - u:qemu:rx,d:u:qemu:rx
a+ /var/mnt - - - - u:qemu:rx
