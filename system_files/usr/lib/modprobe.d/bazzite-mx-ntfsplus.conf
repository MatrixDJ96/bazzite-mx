# The NTFSPLUS driver ships with the image but is a per-host opt-in: this
# stops the kernel from loading it by alias at the first `mount -t ntfs`,
# while an explicit `modprobe ntfs` still works. `ujust setup-ntfsplus enable`
# masks this file with one of the same name under /etc/modprobe.d, which kmod
# reads first. docs/divergences.md § NTFSPLUS.
blacklist ntfs
