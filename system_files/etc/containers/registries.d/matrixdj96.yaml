# Sigstore signatures for our images live next to the image on GHCR, as the
# base's own ublue-os.yaml declares for its scope. The most specific scope
# wins (containers-registries.d(5)), so this file leaves that entry alone.
# Read by podman, skopeo and bootc when policy.json asks for a sigstoreSigned
# image of this scope (11-image-signing.sh writes that policy).

docker:
  ghcr.io/matrixdj96:
    use-sigstore-attachments: true
