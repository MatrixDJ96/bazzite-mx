# Sigstore signatures for our images live next to the image on GHCR. The most
# specific scope wins (containers-registries.d(5)), so the base's ublue-os.yaml
# entry stays untouched. Read when policy.json (11-image-signing.sh) asks for a
# sigstoreSigned image of this scope.

docker:
  ghcr.io/matrixdj96:
    use-sigstore-attachments: true
