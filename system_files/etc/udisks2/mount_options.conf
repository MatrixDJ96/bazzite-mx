# NTFSPLUS mounts a dirty or hibernated volume read-only only under
# errors=remount-ro (docs/divergences.md § NTFSPLUS as a per-host opt-in). A
# key here replaces udisks's builtin set whole: each line is the builtin one
# plus that option.
[defaults]
ntfs:ntfs_defaults=uid=$UID,gid=$GID,windows_names,errors=remount-ro
ntfs:ntfs_allow=uid=$UID,gid=$GID,umask,dmask,fmask,locale,norecover,ignore_case,windows_names,compression,nocompression,big_writes,errors=remount-ro
