# The only workflow that publishes, dispatched by hand, the weekly trigger or
# the watcher, never by a push: version, build, gate (verifies by digest, writes
# the tags), release. :stable moves only when the dispatch asks for it and the
# repository variable PROMOTE_STABLE is "true".
name: Release
run-name: "Release: ${{ inputs.reason }}"

on:
  workflow_dispatch:
    inputs:
      reason:
        description: >-
          Why this release runs (manual, weekly, upstream <base version>); shown as the run name
        type: string
        required: true
      promote_stable:
        description: >-
          Move :stable to this release (also needs the repository variable PROMOTE_STABLE=true)
        type: boolean
        default: false
      release_tag:
        description: >-
          Force the release tag (<fedora>.<yyyymmdd>[.<n>], free on GHCR and on the releases);
          empty resolves today's tag
        type: string
        required: false
        default: ""
      handwritten:
        description: >-
          Small changelog, the release notes' first paragraph; empty writes the generated line
        type: string
        required: false
        default: ""

permissions: {}

# One release runs and one waits on this group, which promote.yml shares; a
# later hand dispatch replaces the waiting one, while the watcher and the weekly
# trigger hold as long as a release run is open.
concurrency:
  group: bazzite-mx-release
  cancel-in-progress: false

# Sets init.defaultBranch, so actions/checkout's `git init` prints no hint.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  version:
    name: Version
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      base_digest_bazzite: ${{ steps.bases.outputs.base_digest_bazzite }}
      base_digest_bazzite_nvidia_open: ${{ steps.bases.outputs.base_digest_bazzite_nvidia_open }}
      base_digest_bazzite_nvidia: ${{ steps.bases.outputs.base_digest_bazzite_nvidia }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Resolve Release Tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          env -u GITHUB_OUTPUT ./.github/scripts/resolve-base.sh bazzite \
            > "$RUNNER_TEMP/base.env"

          if [ -n "$FORCED_TAG" ]; then
            ./.github/scripts/release-tag.sh --tag "$FORCED_TAG" "$RUNNER_TEMP/base.env"
          else
            ./.github/scripts/release-tag.sh "$RUNNER_TEMP/base.env"
          fi

      - name: Resolve Bases
        id: bases
        run: |
          set -euo pipefail
          ./.github/scripts/resolve-base.sh --digests

  build:
    name: Build
    needs: version
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/reusable-build.yml
    with:
      release_tag: ${{ needs.version.outputs.release_tag }}
      rechunk: true
      publish: true
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}

  gate:
    name: Gate
    needs: [version, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Env Files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/release

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Gate Images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
          PROMOTE_INPUT: ${{ inputs.promote_stable }}
          PROMOTE_VAR: ${{ vars.PROMOTE_STABLE }}
          BASE_DIGEST_BAZZITE: ${{ needs.version.outputs.base_digest_bazzite }}
          BASE_DIGEST_BAZZITE_NVIDIA_OPEN: >-
            ${{ needs.version.outputs.base_digest_bazzite_nvidia_open }}
          BASE_DIGEST_BAZZITE_NVIDIA: ${{ needs.version.outputs.base_digest_bazzite_nvidia }}
        run: |
          set -euo pipefail

          args=(
            --base "bazzite=$BASE_DIGEST_BAZZITE"
            --base "bazzite-nvidia-open=$BASE_DIGEST_BAZZITE_NVIDIA_OPEN"
            --base "bazzite-nvidia=$BASE_DIGEST_BAZZITE_NVIDIA"
          )

          if [ "$PROMOTE_INPUT" = true ] && [ "$PROMOTE_VAR" = true ]; then
            args+=(--promote)
          else
            echo "promotion of :stable not requested:" \
              "input promote_stable=$PROMOTE_INPUT, variable PROMOTE_STABLE='${PROMOTE_VAR}'"
          fi

          ./.github/scripts/gate-release.sh release \
            --release-tag "$RELEASE_TAG" \
            --revision "$GITHUB_SHA" \
            "${args[@]}" \
            "$RUNNER_TEMP"/release/release-*.env

  release:
    name: Release
    needs: [version, gate]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 500

      - name: Download Env Files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/release

      - name: Download Package Versions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: ${{ runner.temp }}/packages

      - name: Install ORAS
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Write Release Notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
          HANDWRITTEN: ${{ inputs.handwritten }}
        run: |
          set -euo pipefail

          title=$(./.github/scripts/changelog.sh release \
            --release-tag "$RELEASE_TAG" \
            --out "$RUNNER_TEMP/changelog.md" \
            --handwritten "$HANDWRITTEN" \
            --packages-dir "$RUNNER_TEMP/packages" \
            --packages-out "$RUNNER_TEMP/packages.json" \
            "$RUNNER_TEMP"/release/release-*.env)

          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ steps.notes.outputs.title }}
          tag_name: ${{ needs.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/changelog.md
          working_directory: ${{ runner.temp }}
          files: packages.json
          make_latest: true
