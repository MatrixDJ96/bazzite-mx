# The only workflow that publishes, dispatched by hand, by the weekly trigger
# or by the watcher, never by a push. :stable moves only when the dispatch asks
# for it and the repository variable PROMOTE_STABLE is "true".
name: Release
run-name: "Release: ${{ inputs.reason }}"

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this release runs (manual, weekly, upstream:<digest>); shown as the run name"
        type: string
        required: true
      promote_stable:
        description: "Move :stable to this release (also needs the repository variable PROMOTE_STABLE=true)"
        type: boolean
        default: false

permissions: {}

# Releases queue behind one another and are never cancelled: the watcher and
# the trigger coalesce on this group.
concurrency:
  group: bazzite-mx-release
  cancel-in-progress: false

jobs:
  version:
    name: Resolve the tag and the bases
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      base_digest_bazzite: ${{ steps.bases.outputs.base_digest_bazzite }}
      base_digest_bazzite_nvidia_open: ${{ steps.bases.outputs.base_digest_bazzite_nvidia_open }}
      base_digest_bazzite_nvidia: ${{ steps.bases.outputs.base_digest_bazzite_nvidia }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Anonymous, GHCR answers 403 on a package never published and the probe
      # would fail closed; logged in it answers "name unknown".
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Resolve the release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./.github/scripts/resolve-base.sh bazzite > "$RUNNER_TEMP/base.env"
          ./.github/scripts/release-tag.sh "$RUNNER_TEMP/base.env"

      # Read once here: the gate holds every build job to these digests.
      - name: Resolve the three bases
        id: bases
        run: |
          set -euo pipefail
          ./.github/scripts/resolve-base.sh --digests

  build:
    name: Build the flavours
    needs: version
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/reusable-build.yml
    with:
      release_tag: ${{ needs.version.outputs.release_tag }}
      rechunk: true
      publish: true
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}

  gate:
    name: Gate the three images
    needs: [version, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the release env files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/release

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # cosign and gh attestation verify read the docker credentials
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Verify the images and tag them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
          PROMOTE_INPUT: ${{ inputs.promote_stable }}
          PROMOTE_VAR: ${{ vars.PROMOTE_STABLE }}
          BASE_DIGEST_BAZZITE: ${{ needs.version.outputs.base_digest_bazzite }}
          BASE_DIGEST_BAZZITE_NVIDIA_OPEN: ${{ needs.version.outputs.base_digest_bazzite_nvidia_open }}
          BASE_DIGEST_BAZZITE_NVIDIA: ${{ needs.version.outputs.base_digest_bazzite_nvidia }}
        run: |
          set -euo pipefail
          args=(--base "bazzite=$BASE_DIGEST_BAZZITE"
            --base "bazzite-nvidia-open=$BASE_DIGEST_BAZZITE_NVIDIA_OPEN"
            --base "bazzite-nvidia=$BASE_DIGEST_BAZZITE_NVIDIA")
          if [ "$PROMOTE_INPUT" = true ] && [ "$PROMOTE_VAR" = true ]; then
            args+=(--promote)
          else
            echo "promotion of :stable not requested: input promote_stable=$PROMOTE_INPUT, variable PROMOTE_STABLE='${PROMOTE_VAR}'"
          fi
          ./.github/scripts/gate-release.sh release --release-tag "$RELEASE_TAG" --revision "$GITHUB_SHA" \
            "${args[@]}" "$RUNNER_TEMP"/release/release-*.env

  release:
    name: Publish the release
    needs: [version, gate]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # 500 commits, so the changelog reaches the previous release's revision.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 500

      - name: Download the release env files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/release

      - name: Install oras
        env:
          ORAS_VERSION: 1.3.4
        run: |
          set -euo pipefail
          ./.github/scripts/install-oras.sh "$ORAS_VERSION" "$RUNNER_TEMP/oras"
          echo "$RUNNER_TEMP/oras" >> "$GITHUB_PATH"

      - name: Write the release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          title=$(./.github/scripts/changelog.sh release --release-tag "$RELEASE_TAG" --out "$RUNNER_TEMP/changelog.md" \
            "$RUNNER_TEMP"/release/release-*.env)
          echo "title=$title" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/changelog.md"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
          TITLE: ${{ steps.notes.outputs.title }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/changelog.md" --latest
          echo "release $RELEASE_TAG created: $TITLE"
