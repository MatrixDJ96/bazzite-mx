name: Sign Image

# On-demand signer for an already-published image: the recovery path for a
# build whose sign step failed, or for a tag re-pointed by hand with
# `skopeo copy` (the orphan-tag playbook in docs/workflow.md). Ported from
# bazzite-dx sign_image.yml (a0f3842), restricted to this owner's packages and
# closed with a verification instead of a bare signing.

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image to sign, including the tag (ghcr.io/<owner>/<image>:<tag>)"
        required: true
        type: string

permissions: {}

concurrency:
  group: bazzite-mx-sign-image
  cancel-in-progress: false

jobs:
  sign:
    name: Sign published image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR
        env:
          GH_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GH_REGISTRY_TOKEN" | skopeo login ghcr.io -u "$GH_REGISTRY_USER" --password-stdin

      - name: Resolve digest
        id: resolve
        env:
          IMAGE_TO_SIGN: ${{ inputs.image }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # The signing key is this project's; it may only ever be applied to
          # this owner's packages. A dispatch is a hand-typed string, so the
          # prefix is checked before anything is resolved or signed.
          registry="ghcr.io/${REPO_OWNER,,}/"
          case "$IMAGE_TO_SIGN" in
            "${registry}"?*) ;;
            *)
              echo "::error::refusing to sign '${IMAGE_TO_SIGN}': not under ${registry}"
              exit 1
              ;;
          esac
          # Sign by digest, never by tag: a mutable tag can move between the
          # inspect and the signature, leaving a signature on a manifest nobody
          # asked for.
          inspected=$(skopeo inspect --no-tags "docker://${IMAGE_TO_SIGN}")
          digest=$(jq -r '.Digest' <<< "$inspected")
          name=$(jq -r '.Name' <<< "$inspected")
          [ -n "$digest" ] && [ "$digest" != "null" ] || { echo "::error::no digest for ${IMAGE_TO_SIGN}"; exit 1; }
          echo "Resolved ${IMAGE_TO_SIGN} to ${name}@${digest}"
          {
            echo "digest=$digest"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Sign container image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          IMAGE_NAME: ${{ steps.resolve.outputs.name }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
        run: |
          set -euo pipefail
          # Same flag pairing as the build's signer: cosign 3.x defaults both ON
          # (divergence #23).
          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            --new-bundle-format=false --use-signing-config=false \
            "${IMAGE_NAME}@${DIGEST}"

      - name: Verify signed digest
        env:
          IMAGE_NAME: ${{ steps.resolve.outputs.name }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
        run: |
          set -euo pipefail
          # A signing step that reports success without a readable signature is
          # exactly the silent failure this workflow exists to repair.
          cosign verify --key cosign.pub "${IMAGE_NAME}@${DIGEST}" > /dev/null
          echo "OK: ${IMAGE_NAME}@${DIGEST} verifies against cosign.pub"
