# Recovery signer for an image already on GHCR: a run whose sign step died
# after the push, or a manifest tagged by hand. Signs by digest, because a tag
# can move between the inspect and the signature.
name: Sign Image

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image to sign, with its tag or digest (ghcr.io/matrixdj96/<image>:<tag>)"
        type: string
        required: true

permissions: {}

concurrency:
  group: bazzite-mx-sign-image
  cancel-in-progress: false

jobs:
  sign:
    name: Sign the image by digest
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Resolve the digest
        id: resolve
        env:
          IMAGE_TO_SIGN: ${{ inputs.image }}
        run: |
          set -euo pipefail
          case "$IMAGE_TO_SIGN" in
            ghcr.io/matrixdj96/bazzite-mx[:@]* | ghcr.io/matrixdj96/bazzite-mx-nvidia-open[:@]* \
            | ghcr.io/matrixdj96/bazzite-mx-nvidia[:@]*) ;;
            *)
              echo "refusing to sign '$IMAGE_TO_SIGN': not one of this repository's images" >&2
              exit 1
              ;;
          esac
          inspected=$(skopeo inspect --retry-times 3 --no-tags "docker://$IMAGE_TO_SIGN")
          digest=$(jq -r '.Digest // empty' <<< "$inspected")
          name=$(jq -r '.Name // empty' <<< "$inspected")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] && [ -n "$name" ] || { echo "no digest for $IMAGE_TO_SIGN" >&2; exit 1; }
          echo "resolved $IMAGE_TO_SIGN to $name@$digest"
          echo "ref=$name@$digest" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign and verify
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          REF: ${{ steps.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          cosign sign -y --key env://COSIGN_PRIVATE_KEY --new-bundle-format=false --use-signing-config=false "$REF"
          cosign verify --key cosign.pub "$REF" > /dev/null
          echo "signed and verified: $REF"
