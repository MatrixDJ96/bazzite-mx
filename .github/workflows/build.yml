# The sandbox: on a push to main or develop, a pull request or a dispatch,
# the lint job, then the three flavours through reusable-build.yml. Nothing
# here reaches GHCR and no release comes from a push; main and a dispatch
# with rechunk add the chunked image, its probe and the signing-key proof
# (docs/workflow.md § Branches and profiles).
name: Build

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - docs/**
      - site/**
      - .claude/**
      - LICENSE
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rechunk:
        description: "Run the main profile (chunked image, probe, signing-key proof) on this ref"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: bazzite-mx-build-${{ github.ref_name }}
  cancel-in-progress: true

# The default branch actions/checkout's `git init` would otherwise print a hint about.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run ShellCheck
        run: |
          set -euo pipefail
          shellcheck --version | grep version:

          mapfile -t scripts < <(
            { git ls-files '*.sh'; git grep -l '^#!/usr/bin/env bash'; } | LC_ALL=C sort -u
          )
          shellcheck -x -P SCRIPTDIR --severity=warning "${scripts[@]}"

          echo "shellcheck ok: ${#scripts[@]} scripts"

      - name: Run Self-Tests
        run: |
          set -euo pipefail

          for s in ./.github/scripts/*.sh; do
            "$s" --self-test
          done

          ./build_files/tests/run.sh --self-test

      - name: Check Form
        run: |
          set -euo pipefail

          mapfile -t scripts < <(
            { git ls-files '*.sh'; git grep -l '^#!/usr/bin/env bash'; } | LC_ALL=C sort -u
          )
          ./.github/scripts/check-form.sh "${scripts[@]}"

      - name: Check Commits
        run: ./.github/scripts/check-commits.sh HEAD

      - name: Run shfmt, yamllint and just
        run: |
          set -euo pipefail
          podman run --rm \
            --volume "$PWD:/repo:ro" \
            --workdir /repo \
            quay.io/fedora/fedora:44 \
            bash -euo pipefail -c '
              dnf -q install -y shfmt yamllint just git > /dev/null
              git config --global --add safe.directory /repo

              rpm -q shfmt
              mapfile -t scripts < <(
                { git ls-files "*.sh"; git grep -l "^#!/usr/bin/env bash"; } | LC_ALL=C sort -u
              )
              shfmt --diff \
                --indent 4 \
                --case-indent \
                --binary-next-line \
                --space-redirects \
                "${scripts[@]}"
              echo "shfmt ok: ${#scripts[@]} scripts"

              yamllint --version
              yamllint --strict .
              echo "yamllint ok"

              just --version
              mapfile -t files < <(git ls-files "*.just")
              for f in "${files[@]}"; do
                just --unstable --fmt --check --justfile "$f"
              done
              echo "just --fmt --check ok: ${#files[@]} files"
            '

      # On the host a syntax error is only a journal warning and the script is
      # still marked performed (plasma-workspace, shellcorona.cpp).
      - name: Check Plasma Scripts
        run: |
          set -euo pipefail
          node --version

          mapfile -t scripts < <(git ls-files '*.js')
          for f in "${scripts[@]}"; do
            node --check "$f"
          done

          echo "node --check ok: ${#scripts[@]} scripts"

      - name: Check Site
        run: ./.github/scripts/check-site.sh site

  build:
    name: Build
    needs: lint
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/reusable-build.yml
    with:
      rechunk: ${{ github.ref == 'refs/heads/main' || inputs.rechunk == true }}
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
