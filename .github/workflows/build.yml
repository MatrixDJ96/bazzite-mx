# Lint, then the three flavours through reusable-build.yml. Nothing here
# reaches GHCR and no release comes from a push (docs/workflow.md).
name: Build

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - docs/**
      - site/**
      - .claude/**
      - LICENSE
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rechunk:
        description: "Run the main profile (chunked image, probe, test signature) on this ref"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: bazzite-mx-build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint the tree
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck
        run: |
          set -euo pipefail
          shellcheck --version | grep version:
          mapfile -t scripts < <({ git ls-files '*.sh'; git grep -l '^#!/usr/bin/env bash'; } | LC_ALL=C sort -u)
          shellcheck -x -P SCRIPTDIR --severity=warning "${scripts[@]}"
          echo "shellcheck ok: ${#scripts[@]} scripts"

      # Fedora 44, so CI, the image and the local hook share one shfmt release.
      - name: Run shfmt and yamllint
        run: |
          set -euo pipefail
          podman run --rm --volume "$PWD:/repo:ro" --workdir /repo quay.io/fedora/fedora:44 bash -euo pipefail -c '
            dnf -q install -y shfmt yamllint git > /dev/null
            git config --global --add safe.directory /repo
            shfmt --version
            mapfile -t scripts < <({ git ls-files "*.sh"; git grep -l "^#!/usr/bin/env bash"; } | LC_ALL=C sort -u)
            shfmt --diff --indent 4 --case-indent --binary-next-line --space-redirects "${scripts[@]}"
            echo "shfmt ok: ${#scripts[@]} scripts"
            yamllint --version
            yamllint --strict .
            echo "yamllint ok"
          '

      # On the host a syntax error is only a journal warning and the script is
      # still marked performed (plasma-workspace, shellcorona.cpp).
      - name: Check the Plasma scripts parse
        run: |
          set -euo pipefail
          node --version
          mapfile -t scripts < <(git ls-files '*.js')
          for f in "${scripts[@]}"; do node --check "$f"; done
          echo "node --check ok: ${#scripts[@]} scripts"

      # From the runner's Linuxbrew, not a third-party action.
      - name: Install just from Homebrew
        run: |
          set -euo pipefail
          /home/linuxbrew/.linuxbrew/bin/brew install just
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: Check the recipe formatting
        run: |
          set -euo pipefail
          just --version
          mapfile -t files < <(git ls-files '*.just')
          for f in "${files[@]}"; do just --unstable --fmt --check --justfile "$f"; done
          echo "just --fmt --check ok: ${#files[@]} files"

      - name: Check the site
        run: ./.github/scripts/check-site.sh site

      - name: Run the self-tests
        run: |
          set -euo pipefail
          for s in ./.github/scripts/*.sh; do
            "$s" --self-test
          done
          ./build_files/tests/run.sh --self-test

  # A caller may only maintain or reduce the callee's permissions (GitHub docs,
  # reusable workflows), so the publishing set is granted here and left unused.
  build:
    name: Build the flavours
    needs: lint
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/reusable-build.yml
    with:
      rechunk: ${{ github.ref == 'refs/heads/main' || inputs.rechunk == true }}
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
