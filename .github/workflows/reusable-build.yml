# Reusable build of the three flavours, one job per flavour, called by
# build.yml. The inputs pick the profile: none for the sandbox (build and
# probe), rechunk for main (the chunked image, its probe and the signing-key
# proof). No concurrency group here: a callee inherits the caller's context
# and would collide with the caller's own group (docs/conventions.md § CI).
name: Reusable Build

on:
  workflow_call:
    inputs:
      rechunk:
        description: >-
          Compose the chunked image, probe it and prove the signing key (main profile)
        type: boolean
        default: false
    secrets:
      SIGNING_SECRET:
        description: >-
          cosign private key; with rechunk, its public half is checked against cosign.pub
        required: false

permissions: {}

# The default branch actions/checkout's `git init` would otherwise print a hint about.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  build:
    name: ${{ matrix.flavour }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        flavour: [bazzite, bazzite-nvidia-open, bazzite-nvidia]
    env:
      FLAVOUR: ${{ matrix.flavour }}
      IMAGE: localhost/bazzite-mx:${{ matrix.flavour }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Base
        id: base
        run: |
          set -euo pipefail
          ./.github/scripts/resolve-base.sh "$FLAVOUR" | tee "$RUNNER_TEMP/base.env"

      - name: Write Labels
        id: labels
        run: |
          set -euo pipefail
          ./.github/scripts/image-labels.sh "$RUNNER_TEMP/base.env" "" "$GITHUB_SHA" \
            | tee "$RUNNER_TEMP/labels.txt"

          version=$(sed -n 's/^org\.opencontainers\.image\.version=//p' "$RUNNER_TEMP/labels.txt")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Image
        env:
          BASE_IMAGE: ${{ steps.base.outputs.base_image }}
          IMAGE_NAME: ${{ steps.base.outputs.image_name }}
          VERSION: ${{ steps.labels.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t label_args < <(sed 's/^/--label=/' "$RUNNER_TEMP/labels.txt")

          podman build \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg IMAGE_NAME="$IMAGE_NAME" \
            --build-arg VERSION="$VERSION" \
            "${label_args[@]}" \
            --tag "$IMAGE" \
            .

      - name: Check Image
        run: ./.github/scripts/check-image.sh "$IMAGE" "$RUNNER_TEMP/labels.txt"

      # The df line records the disk left before the pull, the figure a run
      # that dies on ENOSPC needs.
      - name: Compose Chunked Image
        if: inputs.rechunk
        id: rechunk
        run: |
          set -euo pipefail
          out=$(mktemp -d "$RUNNER_TEMP/rechunk-XXXXXX")
          mapfile -t label_args < <(sed 's/^/--label=/' "$RUNNER_TEMP/labels.txt")

          podman run --rm --pull=never --privileged \
            --mount=type=image,src="$IMAGE",target=/rpm-ostree \
            --volume "$out:/run/out:Z" \
            --entrypoint /usr/bin/rpm-ostree \
            "$IMAGE" \
            compose build-chunked-oci \
            --bootc \
            --max-layers 127 \
            --format-version 2 \
            "${label_args[@]}" \
            --rootfs /rpm-ostree \
            --output oci-archive:/run/out/chunked.oci

          podman rmi -f "$IMAGE"
          podman image prune -af > /dev/null
          df -h --output=size,used,avail,target / | tail -n1 | sed 's/^/disk before pull: /'

          chunked=$(podman pull "oci-archive:$out/chunked.oci")
          rm -rf "$out"

          podman tag "$chunked" "$IMAGE-chunked"
          echo "image=$IMAGE-chunked" >> "$GITHUB_OUTPUT"

      - name: Check Chunked Image
        if: inputs.rechunk
        env:
          CHUNKED: ${{ steps.rechunk.outputs.image }}
        run: ./.github/scripts/check-image.sh "$CHUNKED" "$RUNNER_TEMP/labels.txt"

      - name: Install Cosign
        if: inputs.rechunk
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # A SIGNING_SECRET whose public half is not cosign.pub would sign images
      # no host accepts.
      - name: Prove Signing Key
        if: inputs.rechunk
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
        run: |
          set -euo pipefail
          cosign public-key --key env://COSIGN_PRIVATE_KEY > "$RUNNER_TEMP/secret.pub"

          if ! cmp -s "$RUNNER_TEMP/secret.pub" "$GITHUB_WORKSPACE/cosign.pub"; then
            echo "the public half of SIGNING_SECRET is not cosign.pub" >&2
            exit 1
          fi

          echo "signing key ok: the public half of SIGNING_SECRET is cosign.pub"
