# Reusable build of the three flavours, one job per flavour, called by build.yml
# and release.yml. The inputs pick the profile: none for the sandbox (build and
# probe), rechunk for main (the chunked image, its probe and the signing-key
# proof), publish for a release (push to :staging, sign, SBOM, attestation, the
# packages file the release reads, the env file the gate reads). No concurrency
# group: a callee would collide with its caller's.
name: Reusable Build

on:
  workflow_call:
    inputs:
      release_tag:
        description: >-
          Tag the image is versioned with; empty for a sandbox build (<base version>.dev)
        type: string
        default: ""
      rechunk:
        description: >-
          Chunk the image, probe it and prove the signing key (main profile)
        type: boolean
        default: false
      publish:
        description: >-
          Push the chunked image to :staging, sign, SBOM, attest (release profile; needs rechunk)
        type: boolean
        default: false
    secrets:
      SIGNING_SECRET:
        description: >-
          cosign private key; with rechunk, its public half is checked against cosign.pub
        required: false

permissions: {}

# Sets init.defaultBranch, so actions/checkout's `git init` prints no hint.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  build:
    name: ${{ matrix.flavour }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        flavour: [bazzite, bazzite-nvidia-open, bazzite-nvidia]
    env:
      FLAVOUR: ${{ matrix.flavour }}
      IMAGE: localhost/bazzite-mx:${{ matrix.flavour }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          android: false
          large-packages: false
          docker-images: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Base
        id: base
        run: |
          set -euo pipefail
          ./.github/scripts/resolve-base.sh "$FLAVOUR" | tee "$RUNNER_TEMP/base.env"

      - name: Write Labels
        id: labels
        run: |
          set -euo pipefail
          ./.github/scripts/image-labels.sh "$RUNNER_TEMP/base.env" "$RELEASE_TAG" "$GITHUB_SHA" \
            | tee "$RUNNER_TEMP/labels.txt"

          version=$(sed -n 's/^org\.opencontainers\.image\.version=//p' "$RUNNER_TEMP/labels.txt")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Image
        id: build
        env:
          BASE_IMAGE: ${{ steps.base.outputs.base_image }}
          IMAGE_NAME: ${{ steps.base.outputs.image_name }}
          VERSION: ${{ steps.labels.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t label_args < <(sed 's/^/--label=/' "$RUNNER_TEMP/labels.txt")

          podman build \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg IMAGE_NAME="$IMAGE_NAME" \
            --build-arg VERSION="$VERSION" \
            "${label_args[@]}" \
            --tag "$IMAGE" \
            .

      # With rechunk the chunked image is what ships and gets the full probe.
      - name: Check Image
        env:
          RECHUNK: ${{ inputs.rechunk }}
        run: |
          set -euo pipefail
          probe_args=()

          if [ "$RECHUNK" = true ]; then
            probe_args=(--no-probe)
          fi

          ./.github/scripts/check-image.sh "${probe_args[@]}" "$IMAGE" "$RUNNER_TEMP/labels.txt"

      - name: Install Cosign
        if: inputs.rechunk
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # A base carrying ostree.commit or ostree.final-diffid would pass them on, stale.
      - name: Chunk Image
        if: inputs.rechunk
        id: rechunk
        env:
          CHUNKAH_VERSION: v0.7.0
        run: |
          set -euo pipefail
          chunkah=quay.io/coreos/chunkah:$CHUNKAH_VERSION
          out=$(mktemp -d "$RUNNER_TEMP/rechunk-XXXXXX")
          mapfile -t label_args < <(sed 's/^/--label=/' "$RUNNER_TEMP/labels.txt")

          podman pull -q "$chunkah" > /dev/null
          chunkah=$(podman image inspect --format '{{index .RepoDigests 0}}' "$chunkah")
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/coreos/chunkah/' \
            "$chunkah" > /dev/null
          echo "chunkah verified: $chunkah"

          podman image inspect "$IMAGE" > "$out/config.json"
          podman run --rm --pull=never \
            --mount=type=image,src="$IMAGE",target=/chunkah \
            --volume "$out/config.json:/chunkah-config.json:ro,Z" \
            --volume "$out:/run/out:Z" \
            "$chunkah" \
            build \
            --max-layers 256 \
            --prune /sysroot/ \
            "${label_args[@]}" \
            --label ostree.commit- \
            --label ostree.final-diffid- \
            --config /chunkah-config.json \
            --output oci:/run/out/chunked

          podman rmi -f "$IMAGE" "$chunkah"
          podman image prune -af > /dev/null
          # The figure a run that dies on ENOSPC needs.
          df -h --output=size,used,avail,target / | tail -n1 | sed 's/^/disk before pull: /'

          chunked=$(podman pull -q "oci:$out/chunked")
          rm -rf "$out"

          podman tag "$chunked" "$IMAGE-chunked"
          echo "image=$IMAGE-chunked" >> "$GITHUB_OUTPUT"

      - name: Check Chunked Image
        if: inputs.rechunk
        env:
          CHUNKED: ${{ steps.rechunk.outputs.image }}
        run: ./.github/scripts/check-image.sh "$CHUNKED" "$RUNNER_TEMP/labels.txt"

      # A SIGNING_SECRET whose public half is not cosign.pub would sign images
      # no host accepts.
      - name: Prove Signing Key
        if: inputs.rechunk
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
        run: |
          set -euo pipefail
          cosign public-key --key env://COSIGN_PRIVATE_KEY > "$RUNNER_TEMP/secret.pub"

          if ! cmp -s "$RUNNER_TEMP/secret.pub" "$GITHUB_WORKSPACE/cosign.pub"; then
            echo "the public half of SIGNING_SECRET is not cosign.pub" >&2
            exit 1
          fi

          echo "signing key ok: the public half of SIGNING_SECRET is cosign.pub"

      - name: Install Syft
        if: inputs.publish
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.44.0

      - name: Generate SBOM
        if: inputs.publish
        id: sbom
        env:
          CHUNKED: ${{ steps.rechunk.outputs.image }}
          SYFT: ${{ steps.syft.outputs.cmd }}
          IMAGE_NAME: ${{ steps.base.outputs.image_name }}
          VERSION: ${{ steps.labels.outputs.version }}
        run: |
          set -euo pipefail
          cores=$(nproc)

          SYFT_PARALLELISM=$((cores * 2)) buildah unshare bash -euo pipefail -c '
            container=$(buildah from --pull=never "$1")
            trap "buildah rm $container > /dev/null" EXIT
            mnt=$(buildah mount "$container")
            "$2" --source-name "$3" --source-version "$4" "dir:$mnt" -o "syft-json=$5"
          ' bash "$CHUNKED" "$SYFT" "$IMAGE_NAME" "$VERSION" "$RUNNER_TEMP/sbom.json"
          du -h "$RUNNER_TEMP/sbom.json"
          echo "file=$RUNNER_TEMP/sbom.json" >> "$GITHUB_OUTPUT"

      - name: Write Package Versions
        if: inputs.publish
        env:
          SBOM: ${{ steps.sbom.outputs.file }}
          IMAGE_NAME: ${{ steps.base.outputs.image_name }}
        run: |
          set -euo pipefail
          ./.github/scripts/changelog.sh packages \
            --sbom "$SBOM" \
            --image "$IMAGE_NAME" \
            --version "$RELEASE_TAG" \
            --out "$RUNNER_TEMP/packages-$IMAGE_NAME.json"

      - name: Upload Package Versions
        if: inputs.publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.flavour }}
          path: ${{ runner.temp }}/packages-${{ steps.base.outputs.image_name }}.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Login to GHCR
        if: inputs.publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Pushed twice on purpose: podman writes the layer annotations only on the
      # second push (containers/podman#27796). The fix, in container-libs
      # (https://github.com/podman-container-tools/container-libs/pull/1154), is
      # not in the runner's podman: Ubuntu 26.04 ships 5.7.0, no update published.
      - name: Push to GHCR
        if: inputs.publish
        id: push
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          CHUNKED: ${{ steps.rechunk.outputs.image }}
          STAGING: ghcr.io/matrixdj96/${{ steps.base.outputs.image_name }}:staging
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 10
          command: |
            set -euo pipefail

            for _ in 1 2; do
              podman push --compression-format=zstd --compression-level=3 \
                --digestfile "$RUNNER_TEMP/digest" "$CHUNKED" "docker://$STAGING"
            done

            digest=$(cat "$RUNNER_TEMP/digest")

            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "push reported success but wrote no digest" >&2
              exit 1
            fi

            echo "pushed $STAGING -> $digest"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # --new-bundle-format=false is the one layout policy.json's sigstoreSigned
      # reads (containers/container-libs#388, coreos/rpm-ostree#5509).
      - name: Sign Image
        if: inputs.publish
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          REF: >-
            ghcr.io/matrixdj96/${{ steps.base.outputs.image_name }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign -y \
            --key env://COSIGN_PRIVATE_KEY \
            --new-bundle-format=false \
            --use-signing-config=false \
            "$REF"

          echo "signed: $REF"

      - name: Install ORAS
        if: inputs.publish
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Attach and Sign SBOM
        if: inputs.publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          IMAGE_REF: ghcr.io/matrixdj96/${{ steps.base.outputs.image_name }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SBOM: ${{ steps.sbom.outputs.file }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

          cd "$(dirname "$SBOM")"
          oras attach \
            --artifact-type application/vnd.spdx+json \
            --annotation "filename=$(basename "$SBOM")" \
            "$IMAGE_REF@$DIGEST" \
            "$(basename "$SBOM")"

          sbom_type=application/vnd.spdx+json
          sbom_digest=$(oras discover --format json "$IMAGE_REF@$DIGEST" \
            | jq -r --arg type "$sbom_type" \
              '.referrers[] | select(.artifactType == $type) | .digest' \
            | head -n1 || true)

          if [[ ! "$sbom_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "no SBOM referrer after the attach" >&2
            exit 1
          fi

          cosign sign -y \
            --key env://COSIGN_PRIVATE_KEY \
            --new-bundle-format=false \
            --use-signing-config=false \
            "$IMAGE_REF@$sbom_digest"

          echo "sbom attached and signed: $IMAGE_REF@$sbom_digest"

      # Kept out of the registry: a provenance bundle attached there confuses
      # `cosign verify --key`, which reads a certificate-signed referrer before
      # the `.sig`.
      - name: Attest Build Provenance
        if: inputs.publish
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/matrixdj96/${{ steps.base.outputs.image_name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false

      - name: Write Env File
        if: inputs.publish
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          {
            grep -E '^(image_name|base_name|base_digest)=' "$RUNNER_TEMP/base.env"
            echo "digest=$DIGEST"
          } | tee "$RUNNER_TEMP/release-$FLAVOUR.env"

      - name: Upload Env File
        if: inputs.publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.flavour }}
          path: ${{ runner.temp }}/release-${{ matrix.flavour }}.env
          if-no-files-found: error
          retention-days: 7

      - name: Write Image Size Summary
        if: >-
          always() && (steps.rechunk.outcome == 'success'
          || (!inputs.rechunk && steps.build.outcome == 'success'))
        env:
          SHIPPED: ${{ steps.rechunk.outputs.image || env.IMAGE }}
          IMAGE_NAME: ${{ steps.base.outputs.image_name }}
        run: |
          set -euo pipefail
          size=$(podman image inspect --format '{{.Size}}' "$SHIPPED")
          {
            echo "### Final image size (uncompressed)"
            echo '```'
            echo "$IMAGE_NAME: $(numfmt --to=iec-i --suffix=B "$size") ($size bytes)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write Disk Usage Summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Disk usage"
            echo '```'
            df -h
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
