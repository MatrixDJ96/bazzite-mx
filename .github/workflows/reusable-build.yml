# Reusable build of the three flavours; the inputs pick the profile
# (docs/workflow.md). No concurrency group here: a callee inherits the caller's
# context and would collide with the caller's own group (AGENTS.md rule 8).
name: Reusable Build

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Tag the image is versioned with; empty for a sandbox build (<base version>.dev)"
        type: string
        default: ""
      rechunk:
        description: "Compose the chunked image, probe it and prove the signing key (main profile)"
        type: boolean
        default: false
      publish:
        description: "Push the chunked image to :staging, sign, SBOM, attest (release profile; needs rechunk)"
        type: boolean
        default: false
    secrets:
      SIGNING_SECRET:
        description: "cosign private key; with rechunk, a test signature proves it pairs with cosign.pub"
        required: false

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.flavour }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    # A job's permissions cannot depend on an input, so every caller grants the
    # publishing set and `if: inputs.publish` is what keeps a sandbox off GHCR.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        flavour: [bazzite, bazzite-nvidia-open, bazzite-nvidia]
    env:
      FLAVOUR: ${{ matrix.flavour }}
      IMAGE: localhost/bazzite-mx:${{ matrix.flavour }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Require rechunk for publish
        if: inputs.publish && !inputs.rechunk
        run: |
          echo "publish needs rechunk: a host pulls the chunked image, never the raw one" >&2
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve base image
        id: base
        run: |
          set -euo pipefail
          ./.github/scripts/resolve-base.sh "$FLAVOUR" | tee "$RUNNER_TEMP/base.env"

      # One labels file for the build and for the compose step: a composed
      # image inherits no config and would keep the base's labels.
      - name: Write the image labels
        id: labels
        run: |
          set -euo pipefail
          ./.github/scripts/image-labels.sh "$RUNNER_TEMP/base.env" "$RELEASE_TAG" "$GITHUB_SHA" | tee "$RUNNER_TEMP/labels.txt"
          echo "version=$(sed -n 's/^org\.opencontainers\.image\.version=//p' "$RUNNER_TEMP/labels.txt")" >> "$GITHUB_OUTPUT"

      - name: Build image
        env:
          BASE_IMAGE: ${{ steps.base.outputs.base_image }}
          IMAGE_NAME: ${{ steps.base.outputs.image_name }}
          VERSION: ${{ steps.labels.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t label_args < <(sed 's/^/--label=/' "$RUNNER_TEMP/labels.txt")
          podman build \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg IMAGE_NAME="$IMAGE_NAME" \
            --build-arg VERSION="$VERSION" \
            "${label_args[@]}" \
            --tag "$IMAGE" \
            .
          podman image inspect --format 'built {{.Id}} size {{.Size}}' "$IMAGE"

      - name: Check the sandbox image
        if: ${{ !inputs.rechunk }}
        run: ./.github/scripts/check-image.sh "$IMAGE" "$RUNNER_TEMP/labels.txt"

      # The raw image and the base are removed before the pull, which keeps the
      # three copies inside the runner's disk; the df lines measure the margin.
      - name: Compose the chunked image
        if: inputs.rechunk
        id: rechunk
        run: |
          set -euo pipefail
          df -h --output=size,used,avail,target / | tail -n1 | sed 's/^/disk before compose: /'
          out=$(mktemp -d "$RUNNER_TEMP/rechunk-XXXXXX")
          mapfile -t label_args < <(sed 's/^/--label=/' "$RUNNER_TEMP/labels.txt")
          podman run --rm --pull=never --privileged \
            --mount=type=image,src="$IMAGE",target=/rpm-ostree \
            --volume "$out:/run/out:Z" \
            --entrypoint /usr/bin/rpm-ostree \
            "$IMAGE" \
            compose build-chunked-oci --bootc --max-layers 127 --format-version 2 \
            "${label_args[@]}" \
            --rootfs /rpm-ostree --output oci-archive:/run/out/chunked.oci
          ls -l --block-size=M "$out/chunked.oci" | sed 's/^/archive: /'
          podman rmi -f "$IMAGE"
          podman image prune -af > /dev/null
          df -h --output=size,used,avail,target / | tail -n1 | sed 's/^/disk before pull: /'
          chunked=$(podman pull "oci-archive:$out/chunked.oci")
          rm -rf "$out"
          df -h --output=size,used,avail,target / | tail -n1 | sed 's/^/disk after pull: /'
          podman tag "$chunked" "$IMAGE-chunked"
          podman image inspect --format 'chunked {{.Id}} size {{.Size}} layers {{len .RootFS.Layers}}' "$IMAGE-chunked"
          echo "image=$IMAGE-chunked" >> "$GITHUB_OUTPUT"

      - name: Check the chunked image
        if: inputs.rechunk
        env:
          CHUNKED: ${{ steps.rechunk.outputs.image }}
        run: ./.github/scripts/check-image.sh "$CHUNKED" "$RUNNER_TEMP/labels.txt"

      # Installed in the job's temp directory: the instances of a self-hosted
      # runner share one home, and two jobs installing into it at once hit
      # "text file busy" (docs/gotchas.md).
      - name: Install cosign
        if: inputs.rechunk
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
          install-dir: ${{ runner.temp }}/cosign

      # The digest comes from podman: skopeo on containers-storage needs a user
      # namespace the runner denies (docs/gotchas.md).
      - name: Prove the signing key
        if: inputs.rechunk
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          CHUNKED: ${{ steps.rechunk.outputs.image }}
        run: |
          set -euo pipefail
          [ -n "$COSIGN_PRIVATE_KEY" ] || { echo "SIGNING_SECRET is empty: the caller did not pass it" >&2; exit 1; }
          cd "$RUNNER_TEMP"
          podman image inspect --format '{{.Digest}} {{.Id}}' "$CHUNKED" > manifest.json
          grep -qE '^sha256:[0-9a-f]{64} ' manifest.json || { echo "no digest for $CHUNKED" >&2; exit 1; }
          cosign sign-blob -y --key env://COSIGN_PRIVATE_KEY --tlog-upload=false --use-signing-config=false \
            --bundle manifest.bundle.json manifest.json
          cosign verify-blob --key "$GITHUB_WORKSPACE/cosign.pub" --bundle manifest.bundle.json \
            --insecure-ignore-tlog manifest.json
          cp manifest.json tampered.json
          echo tampered >> tampered.json
          if cosign verify-blob --key "$GITHUB_WORKSPACE/cosign.pub" --bundle manifest.bundle.json \
            --insecure-ignore-tlog tampered.json 2> /dev/null; then
            echo "verify-blob accepted a tampered manifest" >&2
            exit 1
          fi
          echo "signing key ok: signature verified with cosign.pub, tampered copy refused"

      - name: Install syft
        if: inputs.publish
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.1

      # syft runs out of memory on the image itself, so it reads an export.
      - name: Generate the SBOM
        if: inputs.publish
        id: sbom
        env:
          CHUNKED: ${{ steps.rechunk.outputs.image }}
          SYFT: ${{ steps.syft.outputs.cmd }}
          IMAGE_NAME: ${{ steps.base.outputs.image_name }}
          VERSION: ${{ steps.labels.outputs.version }}
        run: |
          set -euo pipefail
          rootfs=$RUNNER_TEMP/rootfs
          mkdir -p "$rootfs"
          podman create --name sbom-source "$CHUNKED" /bin/true > /dev/null
          podman export sbom-source | tar -C "$rootfs" --no-same-owner -xf -
          podman rm sbom-source > /dev/null
          chmod -R u+rwX "$rootfs"
          df -h --output=size,used,avail,target / | tail -n1 | sed 's/^/disk with the export: /'
          SYFT_PARALLELISM=$(($(nproc) * 2)) "$SYFT" --source-name "$IMAGE_NAME" --source-version "$VERSION" \
            "dir:$rootfs" -o "syft-json=$RUNNER_TEMP/sbom.json"
          rm -rf "$rootfs"
          rpms=$(jq '[.artifacts[] | select(.type == "rpm")] | length' "$RUNNER_TEMP/sbom.json")
          [ "$rpms" -gt 0 ] || { echo "the SBOM lists no RPM" >&2; exit 1; }
          echo "sbom: $rpms RPMs, $(du -h "$RUNNER_TEMP/sbom.json" | cut -f1)"
          echo "file=$RUNNER_TEMP/sbom.json" >> "$GITHUB_OUTPUT"

      # The credentials live in the job's temp directory, which the runner
      # recreates for every job, never in the host user's own auth files:
      # podman reads REGISTRY_AUTH_FILE, docker, cosign and oras DOCKER_CONFIG.
      - name: Log in to GHCR
        if: inputs.publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/auth"
          export DOCKER_CONFIG="$RUNNER_TEMP/auth" REGISTRY_AUTH_FILE="$RUNNER_TEMP/auth/containers.json"
          printf 'DOCKER_CONFIG=%s\nREGISTRY_AUTH_FILE=%s\n' "$DOCKER_CONFIG" "$REGISTRY_AUTH_FILE" >> "$GITHUB_ENV"
          echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Pushed twice on purpose: podman writes the layer annotations only on the
      # second push (containers/podman#27796).
      - name: Push the staging tag
        if: inputs.publish
        id: push
        env:
          CHUNKED: ${{ steps.rechunk.outputs.image }}
          STAGING: ghcr.io/matrixdj96/${{ steps.base.outputs.image_name }}:staging
        run: |
          set -euo pipefail
          push() { podman push --digestfile "$RUNNER_TEMP/digest" "$CHUNKED" "docker://$STAGING"; }
          for attempt in 1 2 3; do
            if push && push; then break; fi
            [ "$attempt" -lt 3 ] || { echo "push to $STAGING failed 3 times" >&2; exit 1; }
            sleep 15
          done
          digest=$(cat "$RUNNER_TEMP/digest")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "push reported success but wrote no digest" >&2; exit 1; }
          echo "pushed $STAGING -> $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # --new-bundle-format=false is the one layout policy.json's sigstoreSigned
      # reads (containers/container-libs#388, coreos/rpm-ostree#5509).
      - name: Sign the image by digest
        if: inputs.publish
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          REF: ghcr.io/matrixdj96/${{ steps.base.outputs.image_name }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign -y --key env://COSIGN_PRIVATE_KEY --new-bundle-format=false --use-signing-config=false "$REF"
          cosign verify --key cosign.pub "$REF" > /dev/null
          echo "signed and verified: $REF"

      # setup-oras only installs the versions embedded in its own release
      # (docs/gotchas.md).
      - name: Install oras
        if: inputs.publish
        env:
          ORAS_VERSION: 1.3.4
        run: |
          set -euo pipefail
          ./.github/scripts/install-oras.sh "$ORAS_VERSION" "$RUNNER_TEMP/oras"
          echo "$RUNNER_TEMP/oras" >> "$GITHUB_PATH"

      # The SBOM travels with the image as an OCI referrer; changelog.sh reads it.
      - name: Attach and sign the SBOM
        if: inputs.publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          IMAGE_REF: ghcr.io/matrixdj96/${{ steps.base.outputs.image_name }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SBOM: ${{ steps.sbom.outputs.file }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cd "$(dirname "$SBOM")"
          oras attach --artifact-type application/vnd.spdx+json --annotation "filename=$(basename "$SBOM")" \
            "$IMAGE_REF@$DIGEST" "$(basename "$SBOM")"
          sbom_digest=$(oras discover --format json "$IMAGE_REF@$DIGEST" \
            | jq -r '.referrers[] | select(.artifactType == "application/vnd.spdx+json") | .digest' | head -n1)
          [[ "$sbom_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no SBOM referrer after the attach" >&2; exit 1; }
          cosign sign -y --key env://COSIGN_PRIVATE_KEY --new-bundle-format=false --use-signing-config=false \
            "$IMAGE_REF@$sbom_digest"
          echo "sbom attached and signed: $IMAGE_REF@$sbom_digest"

      # Kept out of the registry: a provenance bundle attached there confuses
      # `cosign verify`.
      - name: Attest the build provenance
        if: inputs.publish
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/matrixdj96/${{ steps.base.outputs.image_name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false

      # The gate names the image by digest, never by the :staging tag.
      - name: Write the release env file
        if: inputs.publish
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          {
            grep -E '^(image_name|base_name|base_digest)=' "$RUNNER_TEMP/base.env"
            echo "digest=$DIGEST"
          } | tee "$RUNNER_TEMP/release-$FLAVOUR.env"

      - name: Upload the release env file
        if: inputs.publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.flavour }}
          path: ${{ runner.temp }}/release-${{ matrix.flavour }}.env
          if-no-files-found: error
          retention-days: 7

      # A persistent runner keeps what a job leaves in its storage, and three
      # leftover builds fill a disk: the job's own images and working
      # containers go, the base stays as the cache of the next pull.
      - name: Remove the job's images
        if: always()
        run: |
          set -euo pipefail
          buildah rm --all > /dev/null
          for image in "$IMAGE" "$IMAGE-chunked"; do
            if podman image exists "$image"; then
              podman rmi -f "$image" > /dev/null
            fi
          done
          podman image prune -f > /dev/null
          podman images --format '{{.Repository}}@{{.Digest}} {{.Size}}'
