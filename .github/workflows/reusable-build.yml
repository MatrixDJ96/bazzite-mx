# Reusable build of the three flavours, one job per flavour, called by build.yml
# and release.yml. The inputs pick the profile: none for the sandbox (build and
# probe), rechunk for main (the chunked image, its probe and the signing-key
# proof), publish for a release (push to :staging, sign, SBOM, attestation, the
# env file the gate reads). No concurrency group here: a callee inherits the
# caller's context and would collide with the caller's own group.
name: Reusable Build

on:
  workflow_call:
    inputs:
      release_tag:
        description: >-
          Tag the image is versioned with; empty for a sandbox build (<base version>.dev)
        type: string
        default: ""
      rechunk:
        description: >-
          Compose the chunked image, probe it and prove the signing key (main profile)
        type: boolean
        default: false
      publish:
        description: >-
          Push the chunked image to :staging, sign, SBOM, attest (release profile; needs rechunk)
        type: boolean
        default: false
    secrets:
      SIGNING_SECRET:
        description: >-
          cosign private key; with rechunk, its public half is checked against cosign.pub
        required: false

permissions: {}

# Sets init.defaultBranch, so actions/checkout's `git init` prints no hint.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  build:
    name: ${{ matrix.flavour }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        flavour: [bazzite, bazzite-nvidia-open, bazzite-nvidia]
    env:
      FLAVOUR: ${{ matrix.flavour }}
      IMAGE: localhost/bazzite-mx:${{ matrix.flavour }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Base
        id: base
        run: |
          set -euo pipefail
          ./.github/scripts/resolve-base.sh "$FLAVOUR" | tee "$RUNNER_TEMP/base.env"

      - name: Write Labels
        id: labels
        run: |
          set -euo pipefail
          ./.github/scripts/image-labels.sh "$RUNNER_TEMP/base.env" "$RELEASE_TAG" "$GITHUB_SHA" \
            | tee "$RUNNER_TEMP/labels.txt"

          version=$(sed -n 's/^org\.opencontainers\.image\.version=//p' "$RUNNER_TEMP/labels.txt")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Image
        env:
          BASE_IMAGE: ${{ steps.base.outputs.base_image }}
          IMAGE_NAME: ${{ steps.base.outputs.image_name }}
          VERSION: ${{ steps.labels.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t label_args < <(sed 's/^/--label=/' "$RUNNER_TEMP/labels.txt")

          podman build \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg IMAGE_NAME="$IMAGE_NAME" \
            --build-arg VERSION="$VERSION" \
            "${label_args[@]}" \
            --tag "$IMAGE" \
            .

      - name: Check Image
        run: ./.github/scripts/check-image.sh "$IMAGE" "$RUNNER_TEMP/labels.txt"

      # The df line records the disk left before the pull, the figure a run that
      # dies on ENOSPC needs.
      - name: Compose Chunked Image
        if: inputs.rechunk
        id: rechunk
        run: |
          set -euo pipefail
          out=$(mktemp -d "$RUNNER_TEMP/rechunk-XXXXXX")
          mapfile -t label_args < <(sed 's/^/--label=/' "$RUNNER_TEMP/labels.txt")

          podman run --rm --pull=never --privileged \
            --mount=type=image,src="$IMAGE",target=/rpm-ostree \
            --volume "$out:/run/out:Z" \
            --entrypoint /usr/bin/rpm-ostree \
            "$IMAGE" \
            compose build-chunked-oci \
            --bootc \
            --max-layers 127 \
            --format-version 2 \
            "${label_args[@]}" \
            --rootfs /rpm-ostree \
            --output oci-archive:/run/out/chunked.oci

          podman rmi -f "$IMAGE"
          podman image prune -af > /dev/null
          df -h --output=size,used,avail,target / | tail -n1 | sed 's/^/disk before pull: /'

          chunked=$(podman pull "oci-archive:$out/chunked.oci")
          rm -rf "$out"

          podman tag "$chunked" "$IMAGE-chunked"
          echo "image=$IMAGE-chunked" >> "$GITHUB_OUTPUT"

      - name: Check Chunked Image
        if: inputs.rechunk
        env:
          CHUNKED: ${{ steps.rechunk.outputs.image }}
        run: ./.github/scripts/check-image.sh "$CHUNKED" "$RUNNER_TEMP/labels.txt"

      - name: Install Cosign
        if: inputs.rechunk
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # A SIGNING_SECRET whose public half is not cosign.pub would sign images
      # no host accepts.
      - name: Prove Signing Key
        if: inputs.rechunk
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
        run: |
          set -euo pipefail
          cosign public-key --key env://COSIGN_PRIVATE_KEY > "$RUNNER_TEMP/secret.pub"

          if ! cmp -s "$RUNNER_TEMP/secret.pub" "$GITHUB_WORKSPACE/cosign.pub"; then
            echo "the public half of SIGNING_SECRET is not cosign.pub" >&2
            exit 1
          fi

          echo "signing key ok: the public half of SIGNING_SECRET is cosign.pub"

      - name: Install Syft
        if: inputs.publish
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1

      - name: Generate SBOM
        if: inputs.publish
        id: sbom
        env:
          CHUNKED: ${{ steps.rechunk.outputs.image }}
          SYFT: ${{ steps.syft.outputs.cmd }}
          IMAGE_NAME: ${{ steps.base.outputs.image_name }}
          VERSION: ${{ steps.labels.outputs.version }}
        run: |
          set -euo pipefail
          rootfs=$RUNNER_TEMP/rootfs
          mkdir -p "$rootfs"

          podman create --name sbom-source "$CHUNKED" /bin/true > /dev/null
          podman export sbom-source | tar -C "$rootfs" --no-same-owner -xf -
          podman rm sbom-source > /dev/null
          chmod -R u+rwX "$rootfs"

          cores=$(nproc)
          SYFT_PARALLELISM=$((cores * 2)) "$SYFT" \
            --source-name "$IMAGE_NAME" \
            --source-version "$VERSION" \
            "dir:$rootfs" \
            -o "syft-json=$RUNNER_TEMP/sbom.json"
          rm -rf "$rootfs"
          du -h "$RUNNER_TEMP/sbom.json"
          echo "file=$RUNNER_TEMP/sbom.json" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: inputs.publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Pushed twice on purpose: podman writes the layer annotations only on the
      # second push (containers/podman#27796).
      - name: Push to GHCR
        if: inputs.publish
        id: push
        env:
          CHUNKED: ${{ steps.rechunk.outputs.image }}
          STAGING: ghcr.io/matrixdj96/${{ steps.base.outputs.image_name }}:staging
        run: |
          set -euo pipefail
          push() {
            podman push --digestfile "$RUNNER_TEMP/digest" "$CHUNKED" "docker://$STAGING"
          }

          for attempt in 1 2 3; do
            if push && push; then
              break
            fi

            if [ "$attempt" -ge 3 ]; then
              echo "push to $STAGING failed 3 times" >&2
              exit 1
            fi

            sleep 15
          done

          digest=$(cat "$RUNNER_TEMP/digest")

          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "push reported success but wrote no digest" >&2
            exit 1
          fi

          echo "pushed $STAGING -> $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # --new-bundle-format=false is the one layout policy.json's sigstoreSigned
      # reads (containers/container-libs#388, coreos/rpm-ostree#5509).
      - name: Sign Image
        if: inputs.publish
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          REF: >-
            ghcr.io/matrixdj96/${{ steps.base.outputs.image_name }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign -y \
            --key env://COSIGN_PRIVATE_KEY \
            --new-bundle-format=false \
            --use-signing-config=false \
            "$REF"

          echo "signed: $REF"

      - name: Install ORAS
        if: inputs.publish
        env:
          ORAS_VERSION: 1.3.4
        run: |
          set -euo pipefail
          ./.github/scripts/install-oras.sh "$ORAS_VERSION" "$RUNNER_TEMP/oras"
          echo "$RUNNER_TEMP/oras" >> "$GITHUB_PATH"

      - name: Attach and Sign SBOM
        if: inputs.publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          IMAGE_REF: ghcr.io/matrixdj96/${{ steps.base.outputs.image_name }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SBOM: ${{ steps.sbom.outputs.file }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

          cd "$(dirname "$SBOM")"
          oras attach \
            --artifact-type application/vnd.spdx+json \
            --annotation "filename=$(basename "$SBOM")" \
            "$IMAGE_REF@$DIGEST" \
            "$(basename "$SBOM")"

          sbom_type=application/vnd.spdx+json
          sbom_digest=$(oras discover --format json "$IMAGE_REF@$DIGEST" \
            | jq -r --arg type "$sbom_type" \
              '.referrers[] | select(.artifactType == $type) | .digest' \
            | head -n1 || true)

          if [[ ! "$sbom_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "no SBOM referrer after the attach" >&2
            exit 1
          fi

          cosign sign -y \
            --key env://COSIGN_PRIVATE_KEY \
            --new-bundle-format=false \
            --use-signing-config=false \
            "$IMAGE_REF@$sbom_digest"

          echo "sbom attached and signed: $IMAGE_REF@$sbom_digest"

      # Kept out of the registry: a provenance bundle attached there confuses
      # `cosign verify --key`, which reads a certificate-signed referrer before
      # the `.sig`.
      - name: Attest Build Provenance
        if: inputs.publish
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/matrixdj96/${{ steps.base.outputs.image_name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false

      - name: Write Env File
        if: inputs.publish
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          {
            grep -E '^(image_name|base_name|base_digest)=' "$RUNNER_TEMP/base.env"
            echo "digest=$DIGEST"
          } | tee "$RUNNER_TEMP/release-$FLAVOUR.env"

      - name: Upload Env File
        if: inputs.publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.flavour }}
          path: ${{ runner.temp }}/release-${{ matrix.flavour }}.env
          if-no-files-found: error
          retention-days: 7
