# Moves :stable onto a dated release tag, re-verifying every image first.
# Shares the release concurrency group so it never runs beside a release.
name: Promote

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "The dated release tag (<fedora>.<yyyymmdd>[.N]) :stable moves to, on every image"
        type: string
        required: true

permissions: {}

concurrency:
  group: bazzite-mx-release
  cancel-in-progress: false

jobs:
  promote:
    name: Move :stable to the tag
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Verify and move :stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: ./.github/scripts/gate-release.sh promote --release-tag "$RELEASE_TAG"
